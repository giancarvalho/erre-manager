<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark light" />
    <title>Erre</title>
    <script>(function(){try{var p=localStorage.getItem('erre:theme');var s=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';var n=p==='light'?'light':p==='system'?s:'dark';var c=n==='light'?'#fafafa':'#09090b';var r=document.documentElement;r.style.colorScheme=n;r.style.backgroundColor=c;r.dataset.theme=n;var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',c);}catch(e){}})();</script>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      /* Default before the boot script runs; the script replaces it with the saved theme. */
      html {
        background-color: #09090b;
      }
      @media (prefers-reduced-motion: no-preference) {
        html { transition: background-color 150ms ease-out; }
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>Você precisa ativar o JavaScript para usar o app.</noscript>
    <div id="root"></div>
  </body>
</html>
